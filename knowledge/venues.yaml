# NIH institutes by domain (secondary analyses of public data typically fit R03, R21, K-awards and F32 fellowships)
nih_institutes:
  - {ic: "NIDDK", name: "National Institute of Diabetes and Digestive and Kidney Diseases", domains: [glycemia, kidney, liver, anthropometry, nutrition, iron], url: "https://www.niddk.nih.gov/research-funding"}
  - {ic: "NHLBI", name: "National Heart, Lung, and Blood Institute", domains: [cardio, hematology, iron, respiratory, behaviour], url: "https://www.nhlbi.nih.gov/grants-and-training"}
  - {ic: "NIA", name: "National Institute on Aging", domains: [function], url: "https://www.nia.nih.gov/research/grants-funding"}
  - {ic: "NIMH", name: "National Institute of Mental Health", domains: [mental_health], url: "https://www.nimh.nih.gov/funding"}
  - {ic: "NIMHD", name: "National Institute on Minority Health and Health Disparities", domains: [social], url: "https://www.nimhd.nih.gov/funding/"}
  - {ic: "NIEHS", name: "National Institute of Environmental Health Sciences", domains: [environment], url: "https://www.niehs.nih.gov/funding"}
  - {ic: "NCI", name: "National Cancer Institute", domains: [behaviour], url: "https://www.cancer.gov/grants-training"}

mechanisms:
  - {code: "R03", label: "Small Research Grant", fit: "Secondary analysis of existing data; 2 years; modest budget", url: "https://grants.nih.gov/funding/activity-codes/R03"}
  - {code: "R21", label: "Exploratory/Developmental Research Grant", fit: "Exploratory aims; no preliminary data required", url: "https://grants.nih.gov/funding/activity-codes/R21"}
  - {code: "K23 / K08", label: "Mentored Career Development Award", fit: "Early-career physician-scientists; NHANES findings serve as preliminary data", url: "https://researchtraining.nih.gov/programs/career-development"}
  - {code: "F32", label: "Postdoctoral Individual NRSA Fellowship", fit: "Postdoctoral training with a defined research plan", url: "https://researchtraining.nih.gov/programs/fellowships/F32"}

foundations:
  - {name: "American Heart Association research awards", domains: [cardio, anthropometry, behaviour], url: "https://professional.heart.org/en/research-programs"}
  - {name: "American Diabetes Association research grants", domains: [glycemia], url: "https://diabetes.org/research"}
  - {name: "ASH research awards", domains: [hematology, iron], url: "https://www.hematology.org/awards"}
  - {name: "National Kidney Foundation research grants", domains: [kidney], url: "https://www.kidney.org/professionals/research"}
  - {name: "AASLD Foundation awards", domains: [liver], url: "https://www.aasld.org/aasld-foundation"}
  - {name: "Robert Wood Johnson Foundation", domains: [social, general], url: "https://www.rwjf.org/en/grants.html"}
