# Venues for "Where next?": journals, conferences and funders, tagged by Q2E concept domain.
# Domains: cardio, hematology, iron, liver, kidney, nutrition, glycemia, anthropometry, behaviour, social,
#          environment, function, inflammation, respiratory, mental_health, general.
# Conference abstract deadlines move every year. `deadline_month` is the TYPICAL month the abstract window
# closes and is shown to users as an estimate with a link to the official page - always verify there.

journals:
  - {name: "JAMA Network Open", domains: [general], open_access: true, design_fit: 1.0, url: "https://jamanetwork.com/journals/jamanetworkopen", note: "Broad general-medicine scope; publishes many NHANES cross-sectional analyses"}
  - {name: "JAMA Internal Medicine", domains: [general], open_access: false, design_fit: 0.7, url: "https://jamanetwork.com/journals/jamainternalmedicine", note: "High bar; research letters suit concise national estimates"}
  - {name: "Annals of Internal Medicine", domains: [general], open_access: false, design_fit: 0.6, url: "https://www.acpjournals.org/journal/aim", note: "High bar; brief research reports for national prevalence findings"}
  - {name: "American Journal of Epidemiology", domains: [general], open_access: false, design_fit: 0.8, url: "https://academic.oup.com/aje", note: "Methods-forward epidemiology"}
  - {name: "American Journal of Preventive Medicine", domains: [general, behaviour, social], open_access: false, design_fit: 0.9, url: "https://www.ajpmonline.org/", note: "Population health and prevention"}
  - {name: "Preventive Medicine", domains: [general, behaviour, social], open_access: false, design_fit: 0.9, url: "https://www.sciencedirect.com/journal/preventive-medicine", note: "Prevention and population surveys"}
  - {name: "BMJ Open", domains: [general], open_access: true, design_fit: 0.9, url: "https://bmjopen.bmj.com/", note: "Broad open-access scope"}
  - {name: "PLOS ONE", domains: [general], open_access: true, design_fit: 0.8, url: "https://journals.plos.org/plosone/", note: "Soundness-based review"}
  - {name: "Diabetes Care", domains: [glycemia], open_access: false, design_fit: 0.8, url: "https://diabetesjournals.org/care", note: "Leading clinical diabetes journal; epidemiology section"}
  - {name: "Journal of Clinical Endocrinology & Metabolism", domains: [glycemia, anthropometry], open_access: false, design_fit: 0.8, url: "https://academic.oup.com/jcem", note: "Endocrine and metabolic epidemiology"}
  - {name: "Obesity", domains: [anthropometry, nutrition], open_access: false, design_fit: 0.9, url: "https://onlinelibrary.wiley.com/journal/1930739x", note: "Obesity Society journal"}
  - {name: "Hypertension", domains: [cardio], open_access: false, design_fit: 0.7, url: "https://www.ahajournals.org/journal/hyp", note: "AHA blood-pressure journal"}
  - {name: "Journal of the American Heart Association", domains: [cardio, anthropometry], open_access: true, design_fit: 0.9, url: "https://www.ahajournals.org/journal/jaha", note: "Open-access AHA journal; frequent NHANES analyses"}
  - {name: "American Journal of Kidney Diseases", domains: [kidney], open_access: false, design_fit: 0.8, url: "https://www.ajkd.org/", note: "NKF journal; national CKD epidemiology"}
  - {name: "Clinical Journal of the American Society of Nephrology", domains: [kidney], open_access: false, design_fit: 0.7, url: "https://journals.lww.com/cjasn", note: "ASN clinical journal"}
  - {name: "Kidney Medicine", domains: [kidney], open_access: true, design_fit: 0.9, url: "https://www.kidneymedicinejournal.org/", note: "Open-access NKF journal"}
  - {name: "Blood Advances", domains: [hematology, iron], open_access: true, design_fit: 0.8, url: "https://ashpublications.org/bloodadvances", note: "Open-access ASH journal"}
  - {name: "American Journal of Hematology", domains: [hematology, iron], open_access: false, design_fit: 0.8, url: "https://onlinelibrary.wiley.com/journal/10968652", note: "Clinical hematology"}
  - {name: "Hepatology", domains: [liver], open_access: false, design_fit: 0.6, url: "https://journals.lww.com/hep", note: "AASLD flagship"}
  - {name: "Hepatology Communications", domains: [liver], open_access: true, design_fit: 0.9, url: "https://journals.lww.com/hepcomm", note: "Open-access AASLD journal"}
  - {name: "Clinical Gastroenterology and Hepatology", domains: [liver], open_access: false, design_fit: 0.8, url: "https://www.cghjournal.org/", note: "AGA clinical journal; MASLD epidemiology"}
  - {name: "American Journal of Clinical Nutrition", domains: [nutrition, iron], open_access: false, design_fit: 0.8, url: "https://ajcn.nutrition.org/", note: "ASN nutrition journal"}
  - {name: "Nutrients", domains: [nutrition, iron, anthropometry], open_access: true, design_fit: 0.9, url: "https://www.mdpi.com/journal/nutrients", note: "Open-access nutrition; fast turnaround"}
  - {name: "SLEEP", domains: [behaviour], open_access: false, design_fit: 0.7, url: "https://academic.oup.com/sleep", note: "Sleep Research Society journal", keywords: [sleep, insomnia, apnea, sleepiness]}
  - {name: "Sleep Health", domains: [behaviour], open_access: false, design_fit: 0.9, url: "https://www.sleephealthjournal.org/", note: "Population sleep health", keywords: [sleep, insomnia, apnea, sleepiness]}
  - {name: "Medicine & Science in Sports & Exercise", domains: [behaviour], open_access: false, design_fit: 0.7, url: "https://journals.lww.com/acsm-msse", note: "Physical activity epidemiology", keywords: [physical activity, sedentary, exercise]}
  - {name: "Journal of Affective Disorders", domains: [mental_health], open_access: false, design_fit: 0.9, url: "https://www.sciencedirect.com/journal/journal-of-affective-disorders", note: "Depression epidemiology"}
  - {name: "Journal of the American Geriatrics Society", domains: [function], open_access: false, design_fit: 0.8, url: "https://agsjournals.onlinelibrary.wiley.com/journal/15325415", note: "Aging and functional status"}
  - {name: "Journals of Gerontology, Series A", domains: [function], open_access: false, design_fit: 0.8, url: "https://academic.oup.com/biomedgerontology", note: "Biological and medical sciences of aging"}
  - {name: "Environmental Health Perspectives", domains: [environment], open_access: true, design_fit: 0.8, url: "https://ehp.niehs.nih.gov/", note: "NIEHS open-access journal; biomonitoring"}
  - {name: "Environmental Research", domains: [environment], open_access: false, design_fit: 0.9, url: "https://www.sciencedirect.com/journal/environmental-research", note: "Exposure biomonitoring analyses"}
  - {name: "CHEST", domains: [respiratory], open_access: false, design_fit: 0.7, url: "https://journal.chestnet.org/", note: "Pulmonary epidemiology"}
  - {name: "Journal of Health Care for the Poor and Underserved", domains: [social], open_access: false, design_fit: 0.8, url: "https://www.press.jhu.edu/journals/journal-health-care-poor-and-underserved", note: "Health disparities"}

