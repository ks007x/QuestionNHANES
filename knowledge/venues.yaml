  - {name: "The Liver Meeting", society: "AASLD", domains: [liver], deadline_month: 6, meeting_month: 11, url: "https://www.aasld.org/the-liver-meeting"}
  - {name: "Digestive Disease Week (DDW)", society: "AGA / AASLD / ASGE / SSAT", domains: [liver, nutrition], deadline_month: 12, meeting_month: 5, url: "https://ddw.org/"}
  - {name: "NUTRITION (ASN Annual Meeting)", society: "American Society for Nutrition", domains: [nutrition, iron], deadline_month: 3, meeting_month: 6, url: "https://nutrition.org/nutrition-annual-meeting/"}
  - {name: "SLEEP Annual Meeting", society: "APSS (AASM / SRS)", domains: [behaviour], deadline_month: 12, meeting_month: 6, url: "https://www.sleepmeeting.org/", keywords: [sleep, insomnia, apnea, sleepiness]}
  - {name: "ATS International Conference", society: "American Thoracic Society", domains: [respiratory, behaviour], deadline_month: 11, meeting_month: 5, url: "https://conference.thoracic.org/"}
  - {name: "AGS Annual Scientific Meeting", society: "American Geriatrics Society", domains: [function], deadline_month: 12, meeting_month: 5, url: "https://meeting.americangeriatrics.org/"}
  - {name: "SGIM Annual Meeting", society: "Society of General Internal Medicine", domains: [general, social], deadline_month: 1, meeting_month: 5, url: "https://www.sgim.org/meetings"}
  - {name: "SER Annual Meeting", society: "Society for Epidemiologic Research", domains: [general], deadline_month: 2, meeting_month: 6, url: "https://epiresearch.org/annual-meeting/"}
  - {name: "APHA Annual Meeting", society: "American Public Health Association", domains: [general, social, environment, behaviour], deadline_month: 3, meeting_month: 11, url: "https://www.apha.org/events-and-meetings/annual"}
  - {name: "ISEE Annual Conference", society: "International Society for Environmental Epidemiology", domains: [environment], deadline_month: 3, meeting_month: 8, url: "https://www.iseepi.org/"}
