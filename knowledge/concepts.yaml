# Clinical concept ontology: natural-language phrases -> building blocks or guideline definitions.
# Used by the offline planner and as a constrained vocabulary for the LLM agents.
# Longer synonyms are matched first, so "functional iron deficiency" wins over "iron deficiency".
concepts:
  - id: functional_iron_deficiency
    label: "Functional iron deficiency"
    synonyms: ["functional iron deficiency", "functional id", "fid", "iron-restricted erythropoiesis", "iron restricted erythropoiesis"]
    definitions: [fid_tawfik2024, fid_esc_hf]
    companion_definitions: [aid_tawfik2024]
    domain: iron
  - id: iron_deficiency_anemia
    label: "Iron-deficiency anemia"
    synonyms: ["iron deficiency anemia", "iron-deficiency anemia", "iron deficiency anaemia", "ida"]
    definitions: [ida_ash2026]
    domain: iron
  - id: ckd_iron_deficiency
    label: "Iron deficiency"
    synonyms: ["kdigo iron", "ckd iron deficiency", "iron deficiency in ckd", "ckd-ida", "ckd ida", "iron deficiency in chronic kidney disease", "renal anemia iron"]
    definitions: [ckd_id_kdigo2026, ckd_ire_kdigo2026, ckd_iron_indicated_kdigo2026, ckd_iron_kdigo2012]
    domain: iron
    implies_population: ckd
  - id: iron_deficiency
    label: "Iron deficiency"
    synonyms: ["absolute iron deficiency", "iron deficiency", "iron deficient", "low iron", "iron depletion", "low iron stores"]
    definitions: [id_ash2026, aid_tawfik2024, id_who2020]
    domain: iron
  - id: anemia
    label: "Anemia"
    synonyms: ["anemia", "anaemia", "low hemoglobin", "anemic"]
    definitions: [anemia_who]
    domain: iron
  - id: ferritin
    label: "Serum ferritin"
    synonyms: ["ferritin", "iron stores"]
    block: ferritin
    domain: iron
    default_scale: 1
  - id: tsat
    label: "Transferrin saturation"
    synonyms: ["transferrin saturation", "tsat"]
    block: tsat
    domain: iron
  - id: hemoglobin
    label: "Hemoglobin"
    synonyms: ["hemoglobin", "haemoglobin", "hgb"]
    block: hgb
    domain: iron
  - id: inflammation
    label: "Systemic inflammation"
    synonyms: ["inflammation", "crp", "c-reactive protein", "inflammatory"]
    block: crp
    alt_block: inflammation
    domain: inflammation
  - id: csph
    label: "Clinically significant portal hypertension"
    synonyms: ["clinically significant portal hypertension", "portal hypertension", "csph", "baveno"]
    definitions: [csph_baveno8, csph_baveno7]
    domain: liver
  - id: cacld
    label: "Compensated advanced chronic liver disease"
    synonyms: ["compensated advanced chronic liver disease", "advanced chronic liver disease", "cacld", "advanced fibrosis", "liver fibrosis", "cirrhosis"]
    definitions: [cacld_bin_baveno, cacld_baveno8]
    domain: liver
  - id: liver_stiffness
    label: "Liver stiffness"
    synonyms: ["liver stiffness", "lsm", "fibroscan", "elastography", "transient elastography"]
    block: lsm
    domain: liver
    default_scale: 5
  - id: steatosis
    label: "Hepatic steatosis"
    synonyms: ["steatosis", "fatty liver", "masld", "nafld", "controlled attenuation parameter"]
    block: steatosis
    domain: liver
  - id: fib4
    label: "FIB-4"
    synonyms: ["fib-4", "fib4"]
    block: fib4
    domain: liver
  - id: thrombocytopenia
    label: "Thrombocytopenia"
    synonyms: ["thrombocytopenia", "low platelets", "low platelet count"]
    definitions: [thrombocytopenia_150]
    domain: hematology
  - id: platelets
    label: "Platelet count"
    synonyms: ["platelet count", "platelets"]
    block: plt
    domain: hematology
    default_scale: 50
  - id: glycemic_control
    label: "Glycemic control (HbA1c)"
    synonyms: ["blood sugar control", "glycemic control", "glycaemic control", "blood sugar", "glucose control", "hba1c", "a1c", "glycated hemoglobin", "glycohemoglobin"]
