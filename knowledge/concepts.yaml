# Population phrases -> inclusion criteria (applied in order of appearance in the question).
populations:
  - {id: children, patterns: ["children", "adolescents", "kids", "youth", "pediatric"], criteria: [{label: "Age 1-17 years", expr: "age >= 1 & age < 18"}]}
  - {id: adults, patterns: ["adults", "adult", "grown-ups"], criteria: [{label: "Age >=18 years", expr: "age >= 18"}]}
  - {id: older_adults, patterns: ["older adults", "elderly", "aged 65", "65 and older", "seniors"], criteria: [{label: "Age >=65 years", expr: "age >= 65"}]}
  - {id: women_repro, patterns: ["women of reproductive age", "reproductive-age women", "premenopausal"], criteria: [{label: "Female", expr: "female == 1"}, {label: "Age 18-49 years", expr: "age >= 18 & age <= 49"}]}
  - {id: women, patterns: ["women", "females", "female"], criteria: [{label: "Female", expr: "female == 1"}]}
  - {id: men, patterns: ["men", "males", "male"], criteria: [{label: "Male", expr: "female == 0"}]}
  - {id: pregnant, patterns: ["pregnant", "pregnancy"], criteria: [{label: "Pregnant at examination", expr: "pregnant == 1"}]}
  - {id: ckd, patterns: ["with ckd", "with chronic kidney disease", "with kidney disease", "ckd patients"], criteria: [{label: "CKD (eGFR <60 or UACR >=30)", expr: "ckd == 1"}, {label: "Not on dialysis", expr: "coalesce(dialysis, 0) == 0"}]}
  - {id: diabetes, patterns: ["with diabetes", "diabetic adults", "diabetics"], criteria: [{label: "Diabetes", expr: "diabetes == 1"}]}
  - {id: uncontrolled_htn_pop, patterns: ["with uncontrolled hypertension", "with uncontrolled blood pressure"], criteria: [{label: "Uncontrolled BP (mean SBP >=130 or DBP >=80 mm Hg)", expr: "any_of(sbp >= 130, dbp >= 80)"}]}
  - {id: htn_pop, patterns: ["with hypertension", "hypertensive adults", "with high blood pressure"], criteria: [{label: "Hypertension (ACC/AHA 2017)", expr: "hypertension == 1"}]}
  - {id: nondiabetic, patterns: ["without diabetes", "non-diabetic", "nondiabetic"], criteria: [{label: "No diabetes", expr: "diabetes == 0"}]}
  - {id: heart_failure, patterns: ["with heart failure"], criteria: [{label: "Heart failure", expr: "hf == 1"}]}

# Domain defaults used by the Statistician / Epidemiologist agents.
domains:
  iron:
    covariates: [age, sex, race_eth, pir_cat, bmi, inflammation, ckd]
    exclusions: [{label: "Pregnant at examination", expr: "pregnant == 1", optional: true}]
    required_measures: [ferritin, tsat]
    subgroups: [sex, agecat, race_eth]
    sensitivity:
      - {type: exclude, label: "Exclude hsCRP >5 mg/L (inflammation raises ferritin)", expr: "coalesce(inflammation, 0) == 1"}
      - {type: exclude, label: "Exclude participants treated for anemia", expr: "coalesce(anemia_tx, 0) == 1"}
  glycemia:
    covariates: [age, sex, race_eth, pir_cat, educ, smoking]
    exclusions: [{label: "Pregnant at examination", expr: "pregnant == 1", optional: false}]
    subgroups: [sex, agecat, race_eth]
    sensitivity:
      - {type: exclude, label: "Exclude participants on glucose-lowering therapy", expr: "coalesce(insulin_use, 0) == 1 | coalesce(dm_pills, 0) == 1"}
      - {type: exclude, label: "Exclude anemia (HbA1c unreliable)", expr: "coalesce(anemia, 0) == 1"}
  liver:
    covariates: [age, sex, race_eth, pir_cat, bmi, diabetes, smoking]
    exclusions: [{label: "Self-reported hepatitis B or C", expr: "coalesce(hep_b, 0) == 1 | coalesce(hep_c, 0) == 1", optional: true}]
    required_measures: [lsm_valid]
    subgroups: [sex, agecat]
    sensitivity:
      - {type: exclude, label: "Exclude heavy alcohol (>2 drinks/day men, >1 women)", expr: "coalesce(alcohol_dpd, 0) > ifelse(female == 1, 1, 2)"}
  hematology:
    covariates: [age, sex, race_eth, pir_cat, bmi]
    exclusions: []
    subgroups: [sex, agecat]
    sensitivity: []
  anthropometry:
    covariates: [age, sex, race_eth, pir_cat, smoking]
    exclusions: [{label: "Pregnant at examination", expr: "pregnant == 1", optional: false}]
    subgroups: [sex, agecat]
    sensitivity: []
  kidney:
    covariates: [age, sex, race_eth, pir_cat, diabetes, htn_selfreport]
    exclusions: []
    subgroups: [sex, agecat]
    sensitivity: []
  cardio:
    covariates: [age, sex, race_eth, pir_cat, educ, smoking, bmi, diabetes]
    exclusions: [{label: "Pregnant at examination", expr: "pregnant == 1", optional: false}]
    subgroups: [sex, agecat, race_eth]
    sensitivity:
      - {type: exclude, label: "Exclude self-reported cardiovascular disease", expr: "coalesce(cvd, 0) == 1"}
  mental_health:
    covariates: [age, sex, race_eth, pir_cat, educ, smoking, bmi, insured]
    exclusions: []
    subgroups: [sex, agecat, race_eth]
    sensitivity: []
  behaviour:
    covariates: [age, sex, race_eth, pir_cat, educ, bmi]
    exclusions: []
    subgroups: [sex, agecat]
    sensitivity: []
  social:
    covariates: [age, sex, race_eth, educ]
    exclusions: []
    subgroups: [sex, agecat, race_eth]
    sensitivity: []
  environment:
    covariates: [age, sex, race_eth, pir_cat, educ, smoking]
    exclusions: []
    subgroups: [sex, agecat, race_eth]
    sensitivity:
      - {type: exclude, label: "Exclude active smokers by cotinine", expr: "coalesce(active_smoker_cot, 0) == 1"}
  nutrition:
    covariates: [age, sex, race_eth, pir_cat, educ, bmi, energy_kcal]
    exclusions: [{label: "Pregnant at examination", expr: "pregnant == 1", optional: false}]
    required_measures: [diet_reliable]
    subgroups: [sex, agecat]
    sensitivity: []
  function:
    covariates: [age, sex, race_eth, pir_cat, educ, bmi, smoking]
    exclusions: []
    subgroups: [sex, agecat, race_eth]
    sensitivity: []
  respiratory:
    covariates: [age, sex, race_eth, pir_cat, smoking, bmi]
    exclusions: []
    subgroups: [sex, agecat]
    sensitivity: []
  default:
    covariates: [age, sex, race_eth, pir_cat]
    exclusions: []
    subgroups: [sex, agecat]
    sensitivity: []

# Known causal-structure warnings (exposure concept, outcome concept, variable, role, note)
causal_flags:
  - {exposure: abdominal_obesity, outcome: glycemic_control, variable: diabetes, role: mediator_or_outcome, note: "Diabetes status is defined partly by HbA1c and lies on the causal path; adjusting for it is over-adjustment."}
  - {exposure: abdominal_obesity, outcome: glycemic_control, variable: bmi, role: intended_adjustment, note: "BMI adjustment isolates the contribution of central adiposity beyond overall weight ('at similar weight'). Expect collinearity with waist (VIF check)."}
  - {exposure: obesity, outcome: glycemic_control, variable: diabetes, role: mediator_or_outcome, note: "Do not adjust for diabetes when HbA1c is the outcome."}
  - {exposure: ckd, outcome: anemia, variable: egfr, role: definitional, note: "eGFR defines CKD; adjusting for it removes the exposure."}
  - {exposure: liver_stiffness, outcome: thrombocytopenia, variable: fib4, role: definitional, note: "FIB-4 contains platelet count - definitional overlap with the outcome."}
  - {exposure: sodium_intake, outcome: hypertension, variable: bmi, role: possible_mediator, note: "BMI may partly mediate diet-blood pressure associations; consider a model without BMI."}
  - {exposure: abdominal_obesity, outcome: hypertension, variable: diabetes, role: mediator_or_outcome, note: "Diabetes may lie on the path from adiposity to hypertension."}
  - {exposure: insomnia, outcome: depression, variable: phq9_sleep_item, role: measurement_overlap, note: "PHQ-9 item 3 asks about trouble sleeping - the outcome partly measures the exposure. Run PHQ-8 (item 3 removed) as a sensitivity analysis."}
  - {exposure: short_sleep, outcome: depression, variable: phq9_sleep_item, role: measurement_overlap, note: "PHQ-9 item 3 asks about sleep; use PHQ-8 sensitivity analysis."}
  - {exposure: sleep_duration, outcome: depression, variable: phq9_sleep_item, role: measurement_overlap, note: "PHQ-9 item 3 asks about sleep; use PHQ-8 sensitivity analysis."}
  - {exposure: depression, outcome: cvd, variable: smoking, role: possible_mediator, note: "Smoking may be both a confounder and a mediator of depression-CVD associations."}

# Lay/clinical phrases -> NHANES components (tables) that measure them, for topics without curated variables.
# Used to tell the investigator "NHANES does measure this, in these files" and to steer catalog searches.
component_synonyms:
  - {phrases: ["hearing", "hearing loss", "deafness", "audiometry", "tinnitus"], tables: [AUX, AUQ], note: "Audiometry exam (selected ages/cycles) and hearing questionnaire"}
  - {phrases: ["bone density", "bone mineral density", "osteoporosis", "osteopenia", "dxa", "dexa"], tables: [DXXFEM, DXXSPN, DXX, OSQ], note: "DXA femur/spine (cycle- and age-dependent) and osteoporosis questionnaire"}
  - {phrases: ["body composition", "low muscle mass", "muscle mass", "lean mass", "fat mass", "sarcopenia", "visceral fat area", "appendicular lean mass"], tables: [DXX, DXXAG], note: "Whole-body DXA (ages 8-59 in most cycles)"}
  - {phrases: ["cognition", "cognitive function", "cognitive performance", "memory", "cognitive impairment"], tables: [CFQ], note: "Cognitive tests in adults >=60 y, 2011-2014 only (not in the 2015-2023 cycles Q2E supports)"}
  - {phrases: ["grip strength", "muscle strength", "handgrip"], tables: [MGX], note: "Handgrip dynamometry, 2011-2014 only (not in the 2015-2023 cycles Q2E supports)"}
  - {phrases: ["dental", "teeth", "oral health", "periodontitis", "periodontal disease", "tooth loss", "caries"], tables: [OHXDEN, OHXPER, OHQ], note: "Oral health exam and questionnaire"}
  - {phrases: ["vision", "visual impairment", "eye disease", "retinopathy"], tables: [VIX, VIQ, OPXRET], note: "Vision exam/questionnaire (selected cycles)"}
  - {phrases: ["grip", "handgrip strength"], tables: [MGX], note: "Handgrip dynamometry, 2011-2014"}
  - {phrases: ["medications", "prescription drugs", "statin use", "polypharmacy", "metformin", "ppi use", "aspirin use"], tables: [RXQ_RX, RXQASA], note: "Prescription medication file (30-day use, drug names/classes)"}
  - {phrases: ["supplements", "supplement use", "iron supplements", "multivitamin"], tables: [DSQTOT, DSQIDS, DS1TOT], note: "Dietary supplement use (30-day and 24-h)"}
  - {phrases: ["health care utilization", "hospitalization", "hospital admissions", "emergency department visits"], tables: [HUQ], note: "Self-reported hospital use in past 12 months (no claims data)"}
  - {phrases: ["hepatitis b", "hepatitis b serology", "hepatitis c antibody", "hcv rna"], tables: [HEPBD, HEPB_S, HEPC], note: "Hepatitis serology"}
  - {phrases: ["hiv"], tables: [HIV], note: "HIV antibody (adults 18-59, selected cycles)"}
  - {phrases: ["pfas", "perfluoroalkyl", "phthalates", "bisphenol", "pesticides", "arsenic", "volatile organic compounds"], tables: [PFAS, PHTHTE, EPHPP, UAS, UVOC], note: "Environmental chemicals (one-third subsamples, special weights)"}
  - {phrases: ["testosterone", "estradiol", "sex hormones", "shbg"], tables: [TST], note: "Sex steroid hormones (selected cycles)"}
  - {phrases: ["thyroid function", "tsh", "free t4"], tables: [THYROD], note: "Thyroid profile (selected cycles, subsample)"}
  - {phrases: ["folate", "vitamin b12", "homocysteine"], tables: [FOLATE, FOLFMS], note: "Folate (most cycles); B12 not measured after 2006"}
  - {phrases: ["urine sodium", "urinary sodium", "iodine"], tables: [UIO], note: "Urinary iodine (subsample)"}
  - {phrases: ["alcohol use disorder", "binge drinking", "heavy drinking"], tables: [ALQ], note: "Alcohol use questionnaire"}
  - {phrases: ["drug use", "marijuana", "cannabis", "cocaine", "opioid use"], tables: [DUQ], note: "Drug use questionnaire (ages 18-69, ACASI)"}
  - {phrases: ["sexual behavior"], tables: [SXQ], note: "Sexual behavior (ACASI, restricted ages)"}
  - {phrases: ["reproductive health", "menopause", "menarche", "parity", "pregnancies"], tables: [RHQ], note: "Reproductive health questionnaire (women)"}
  - {phrases: ["shift work", "night shift", "night work", "work schedule", "occupation", "employment", "work hours"], tables: [OCQ], note: "Occupation questionnaire"}
  - {phrases: ["housing", "housing characteristics"], tables: [HOQ], note: "Housing characteristics"}

  - {phrases: ["falls", "fall", "fall risk", "balance"], tables: [BAQ, BAX], note: "Balance and falls questionnaire/exam were collected in 1999-2004 only"}

# Things NHANES cannot measure (or only via linked/restricted files) - drives the answerability verdict.
not_in_nhanes:
  - {phrases: ["mortality", "death", "deaths", "die", "survival", "all-cause mortality", "cause-specific mortality"], severity: fail, hard_stop: true, reason: "NHANES itself has no follow-up. Mortality requires the NCHS Linked Mortality Files (NDI linkage) - not integrated in Q2E yet.", suggestion: "Download the public-use Linked Mortality File and analyse with survey-weighted Cox models, or reframe as a cross-sectional prevalence/association question."}
  - {phrases: ["cumulative incidence", "incidence", "incident", "new-onset", "develop", "developing", "risk of developing", "future risk", "predicts future", "after transplant", "post-transplant"], severity: fail, hard_stop: true, reason: "NHANES is cross-sectional: each person is measured once, so incidence cannot be estimated.", suggestion: "Ask about prevalence or a cross-sectional association, or use a cohort (e.g., linked mortality, CMS linkage)."}
  - {phrases: ["frailty index", "frailty", "frail"], severity: fail, reason: "No validated frailty measure is collected directly; a deficit-accumulation frailty index must be constructed from 30+ items and is not yet encoded in Q2E.", suggestion: "Use functional limitation or disability as the outcome, or add a frailty-index definition to the library."}
  - {phrases: ["restless legs syndrome", "restless leg syndrome", "restless legs", "willis-ekbom"], severity: fail, reason: "NHANES does not ask about restless legs symptoms in recent cycles.", suggestion: "Use a cohort with RLS assessment (e.g., NHS/HPFS) or study iron deficiency with sleep complaints instead."}
  - {phrases: ["polysomnography", "apnea-hypopnea index", "ahi", "sleep study", "actigraphy"], severity: fail, reason: "No polysomnography or (recent) actigraphy in NHANES; only questionnaire sleep measures.", suggestion: "Use questionnaire proxies (snoring/witnessed apneas) and state the limitation, or use MESA/SHHS."}
  - {phrases: ["weight gain", "gain weight", "weight change", "weight loss over"], severity: fail, reason: "Change in weight requires repeated measurements; NHANES measures weight once (self-reported past weight is recall-based).", suggestion: "Study cross-sectional BMI/obesity, or use recalled weight 10 years ago (WHQ) with explicit recall-bias caveats."}
  - {phrases: ["dementia", "alzheimer", "alzheimers"], severity: fail, reason: "No clinical dementia diagnosis in NHANES. Cognitive test scores exist only for adults >=60 y in 2011-2014 (CFQ).", suggestion: "Use CFQ cognitive scores (2011-2014) as the outcome."}
  - {phrases: ["clostridioides difficile infection", "clostridium difficile infection", "c. difficile infection", "c. diff infection", "clostridioides difficile", "clostridium difficile", "c. difficile", "c. diff", "c diff", "cdi", "hospital-acquired infection", "nosocomial", "bacteremia", "bloodstream infection"], severity: fail, hard_stop: true, reason: "Acute infections such as C. difficile are diagnosed in clinical care; NHANES has no stool testing, infection episodes or hospital follow-up.", suggestion: "Use transplant registry (CIBMTR), EHR or claims data with time-to-event methods (e.g. cumulative incidence with competing risks)."}
  - {phrases: ["sepsis", "septic shock", "icu", "intensive care", "febrile neutropenia", "neutropenic fever"], severity: fail, hard_stop: true, reason: "NHANES samples community-dwelling people at a single visit; acute hospital events are not captured.", suggestion: "Use EHR, claims, MIMIC or registry data; NHANES can describe community neutrophil counts (benign neutropenia) instead."}
  - {phrases: ["hematopoietic cell transplantation", "hematopoietic stem cell transplantation", "hematopoietic cell transplant", "stem cell transplantation", "allogeneic transplantation", "allogeneic transplant", "allo-hct", "allo-hsct", "allogeneic hct", "allogeneic", "hsct", "transplantation", "transplant", "stem cell transplant", "bmt", "gvhd", "graft-versus-host"], severity: fail, hard_stop: true, reason: "Transplant recipients and procedures are not identifiable in NHANES.", suggestion: "Use CIBMTR or institutional transplant data."}
  - {phrases: ["cardiovascular-kidney-metabolic syndrome", "cardiovascular kidney metabolic syndrome", "cardiovascular-kidney-metabolic", "ckm syndrome", "ckm stages", "ckm stage", "ckm"], severity: fail, reason: "CKM staging (AHA 2023 advisory) is computable from NHANES but needs the PREVENT 10-year risk equations and staging rules, which are not yet encoded in the definitions library. Q2E will not substitute metabolic syndrome.", suggestion: "Add a CKM staging definition (incl. PREVENT equations) to the library via Guideline import, or ask about its components (adiposity, metabolic syndrome, CKD, CVD)."}
  - {phrases: ["chemotherapy", "cancer stage", "cancer treatment", "tumor", "leukemia", "lymphoma", "myeloma"], severity: fail, reason: "NHANES records only self-reported cancer history and type; no stage, treatment or pathology.", suggestion: "Use SEER, NCDB or registry data; NHANES can study cancer survivors (MCQ220) cross-sectionally."}
  - {phrases: ["mri", "ct scan", "imaging", "echocardiogram", "ejection fraction", "coronary calcium"], severity: fail, reason: "No cross-sectional imaging beyond DXA and liver elastography.", suggestion: "Use MESA, UK Biobank or institutional imaging cohorts."}
  - {phrases: ["genetic", "genome", "gene", "snp", "polygenic"], severity: fail, hard_stop: true, reason: "Genetic data are restricted-access (NCHS Research Data Center) and not in public files.", suggestion: "Apply to the NCHS RDC or use UK Biobank / All of Us."}
  - {phrases: ["randomized", "treatment effect", "efficacy", "trial"], severity: fail, hard_stop: true, reason: "Observational survey data cannot estimate treatment efficacy like a trial.", suggestion: "Reframe as an association with confounding adjustment and a clear non-causal interpretation."}
  - {phrases: ["over time", "trend", "trends", "changed since", "temporal"], severity: caution, reason: "Trends need several cycles with consistent methods and trend tests.", suggestion: "Select multiple non-overlapping cycles and add a cycle term (joinpoint/orthogonal polynomials)."}
  - {phrases: ["children under", "infants", "toddlers"], severity: caution, reason: "Many laboratory measures are not collected in young children.", suggestion: "Check age eligibility of each component in the probe."}
