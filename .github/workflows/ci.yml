name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R packages
        run: Rscript r/install_packages.R
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -r requirements-dev.txt
      - name: Synthetic NHANES-like data
        run: Rscript r/synth/make_synthetic_nhanes.R data/synthetic 12000 20261010
      - name: R engine tests
        run: Rscript r/tests/run_tests.R
      - name: Python tests (incl. end-to-end R runs)
        run: python -m pytest -q tests
      - name: Run example studies
        run: python -m q2e examples --source synthetic --out outputs/examples
      - uses: actions/upload-artifact@v4
        with:
          name: example-manuscripts
          path: outputs/examples
