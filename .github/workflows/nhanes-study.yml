name: Run a study on real NHANES data

# Click "Actions" -> "Run a study on real NHANES data" -> "Run workflow", type a question, and go.
# GitHub's server downloads the public NHANES files straight from the CDC, runs the R analysis,
# and attaches the manuscript + reproducibility bundle to the run (Artifacts section).
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Research question in plain English"
        required: true
        default: "I have noticed that adults with greater abdominal obesity may have worse blood sugar control even at similar weight."
      cycles:
        description: "NHANES cycles, space-separated (P = 2017-Mar 2020; L = 2021-2023; J = 2017-2018; I = 2015-2016)"
        required: true
        default: "P"
      approver:
        description: "Name recorded as the approving investigator"
        required: true
        default: "Investigator"

permissions:
  contents: write   # lets the run save its outputs to the 'results' branch

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      Q2E_ALLOW_DOWNLOAD: "true"
      Q2E_LLM_PROVIDER: offline        # no study content leaves the runner
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::survey
            any::jsonlite
            any::haven
            any::ggplot2
            any::mice
            any::mitools
            any::yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Reuse previously downloaded CDC files
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nhanes-${{ inputs.cycles }}-${{ github.run_id }}
          restore-keys: nhanes-${{ inputs.cycles }}-
      - name: Design, approve, download from CDC and analyse
        env:
          QUESTION: ${{ inputs.question }}
          CYCLES: ${{ inputs.cycles }}
          APPROVER: ${{ inputs.approver }}
        run: |
          python -m q2e study "$QUESTION" --source cdc --cycles $CYCLES --approver "$APPROVER" --out outputs/real 2>&1 | tee outputs_log.txt
          exit ${PIPESTATUS[0]}
      - name: Summary
        if: always()
        env:
          QUESTION: ${{ inputs.question }}
        run: |
          { echo "## Question"; echo; echo "> $QUESTION"; echo;
            echo '```'; tail -n 40 outputs_log.txt 2>/dev/null || echo "(analysis step did not run)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ -f outputs/real/manuscript.md ] && cat outputs/real/manuscript.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhanes-study-${{ github.run_number }}
          path: |
            outputs/real
            outputs_log.txt
      - name: Save outputs to the 'results' branch (browsable on github.com)
        if: success()
        env:
          QUESTION: ${{ inputs.question }}
        run: |
          dest="runs/$(date -u +%Y-%m-%d)-run${{ github.run_number }}"
          mkdir -p /tmp/pub && cp -r outputs/real/. /tmp/pub/ && cp outputs_log.txt /tmp/pub/
          (cd /tmp/pub && unzip -q -o bundle.zip -d bundle || true)
          printf '# %s\n\nRun %s, cycles %s, approved by %s.\n\n[Manuscript](manuscript.md) | [Run log](outputs_log.txt) | [Bundle](bundle/)\n' \
            "$QUESTION" "${{ github.run_number }}" "${{ inputs.cycles }}" "${{ inputs.approver }}" > /tmp/pub/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin results 2>/dev/null; then git checkout -q -B results FETCH_HEAD; else git checkout -q --orphan results && git rm -rqf . ; fi
          mkdir -p "$dest" && cp -r /tmp/pub/. "$dest/"
          echo "- [$dest]($dest/README.md): $QUESTION" >> INDEX.md
          git add -f INDEX.md "$dest"
          git commit -qm "Results: run ${{ github.run_number }}"
          git push -q origin results
