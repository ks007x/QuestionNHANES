name: Run a study on real NHANES data

# Click "Actions" -> "Run a study on real NHANES data" -> "Run workflow", type a question, and go.
# GitHub's server downloads the public NHANES files straight from the CDC, runs the R analysis,
# and attaches the manuscript + reproducibility bundle to the run (Artifacts section).
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Research question in plain English"
        required: true
        default: "I have noticed that adults with greater abdominal obesity may have worse blood sugar control even at similar weight."
      cycles:
        description: "NHANES cycles: 'auto' picks the most recent cycle(s) that measured the variables; or list codes, e.g. 'P' (2017-Mar 2020), 'L' (2021-2023), 'G' (2011-2012)"
        required: true
        default: "auto"
      approver:
        description: "Name recorded as the approving investigator"
        required: true
        default: "Investigator"
      ai:
        description: "AI agents: 'offline' (rule-based, nothing leaves the runner) or 'bedrock' (needs the AWS secrets in docs/BEDROCK.md)"
        type: choice
        options: [offline, bedrock]
        default: offline

permissions:
  contents: write   # lets the run save its outputs to the 'results' branch

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      Q2E_ALLOW_DOWNLOAD: "true"
      # offline: no study content leaves the runner. bedrock: only metadata and aggregate results are sent (never rows).
      Q2E_LLM_PROVIDER: ${{ inputs.ai || 'offline' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::survey
            any::jsonlite
            any::haven
            any::ggplot2
            any::mice
            any::mitools
            any::yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Connect to AWS Bedrock
        if: inputs.ai == 'bedrock'
        env:
          S_TOKEN: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          S_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S_SESSION: ${{ secrets.AWS_SESSION_TOKEN }}
          S_MODEL: ${{ vars.Q2E_BEDROCK_MODEL_ID || secrets.Q2E_BEDROCK_MODEL_ID }}
          S_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          # export only the values that are set, so an empty secret never hides a real credential
          for pair in "AWS_BEARER_TOKEN_BEDROCK=$S_TOKEN" "AWS_ACCESS_KEY_ID=$S_KEY" "AWS_SECRET_ACCESS_KEY=$S_SECRET" \
                      "AWS_SESSION_TOKEN=$S_SESSION" "Q2E_BEDROCK_MODEL_ID=$S_MODEL" "AWS_REGION=$S_REGION"; do
            [ -n "${pair#*=}" ] && echo "$pair" >> "$GITHUB_ENV"
          done
          if [ -z "$S_TOKEN" ] && [ -z "$S_KEY" ]; then
            echo "::error title=Bedrock not set up::Add the repository secret AWS_BEARER_TOKEN_BEDROCK (or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY). See docs/BEDROCK.md"; exit 1; fi
          if [ -z "$S_MODEL" ]; then
            echo "::error title=Bedrock not set up::Add the repository variable Q2E_BEDROCK_MODEL_ID (e.g. us.anthropic.claude-...). See docs/BEDROCK.md"; exit 1; fi
      - name: Check Bedrock answers
        if: inputs.ai == 'bedrock'
        run: python -m q2e bedrock-check
      - name: Reuse previously downloaded CDC files
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nhanes-${{ inputs.cycles }}-${{ github.run_id }}
          restore-keys: nhanes-${{ inputs.cycles }}-
      - name: Design, approve, download from CDC and analyse
        env:
          QUESTION: ${{ inputs.question }}
          CYCLES: ${{ inputs.cycles }}
          APPROVER: ${{ inputs.approver }}
        run: |
          if [ "$CYCLES" = "auto" ] || [ -z "$CYCLES" ]; then CY=""; else CY="--cycles $CYCLES"; fi
          python -m q2e study "$QUESTION" --source cdc $CY --approver "$APPROVER" --out outputs/real 2>&1 | tee outputs_log.txt
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "::error title=Q2E run failed::$(grep -E 'Run failed|Error|ERROR|in:|Blockers|Traceback|Exception' outputs_log.txt | tail -8 | tr '\n' ' ' | cut -c1-900)"; fi
          exit $rc
      - name: Summary
        if: always()
        env:
          QUESTION: ${{ inputs.question }}
        run: |
          { echo "## Question"; echo; echo "> $QUESTION"; echo;
            echo '```'; tail -n 40 outputs_log.txt 2>/dev/null || echo "(analysis step did not run)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ -f outputs/real/manuscript.md ] && cat outputs/real/manuscript.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhanes-study-${{ github.run_number }}
          path: |
            outputs/real
            outputs_log.txt
      - name: Save outputs to the 'results' branch (browsable on github.com)
        if: success()
        env:
          QUESTION: ${{ inputs.question }}
        run: |
          dest="runs/$(date -u +%Y-%m-%d)-run${{ github.run_number }}"
          mkdir -p /tmp/pub && cp -r outputs/real/. /tmp/pub/ && cp outputs_log.txt /tmp/pub/
          (cd /tmp/pub && unzip -q -o bundle.zip -d bundle || true)
          printf '# %s\n\nRun %s, cycles %s, approved by %s, AI agents: ${{ inputs.ai || 'offline' }}.\n\n[Manuscript](manuscript.md) | [Run log](outputs_log.txt) | [Bundle](bundle/)\n' \
            "$QUESTION" "${{ github.run_number }}" "${{ inputs.cycles }}" "${{ inputs.approver }}" > /tmp/pub/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            if git fetch -q --depth 1 origin results 2>/dev/null; then git checkout -q -f -B results FETCH_HEAD; else git checkout -q -f --orphan results && git rm -rqf . ; fi
            mkdir -p "$dest" && cp -r /tmp/pub/. "$dest/"
            { echo "# Q2E study runs"; echo; for d in $(ls -1r runs); do echo "- [$d](runs/$d/README.md): $(head -1 runs/$d/README.md | sed 's/^# //')"; done; } > INDEX.md
            git add -f INDEX.md "$dest"
            git commit -qm "Results: run ${{ github.run_number }}"
            if git push -q origin results; then echo "Saved to results/$dest"; exit 0; fi
            echo "Push raced with another run - retrying ($attempt)"; sleep $((attempt * 5))
          done
          exit 1
