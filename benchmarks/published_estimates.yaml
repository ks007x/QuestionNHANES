# Published NHANES prevalence estimates used to measure Q2E's accuracy.
#
# Every number was copied from the official report or article (crude, i.e. not age-adjusted, because Q2E reports
# crude prevalence). Percentages. When a report gives only standard errors, `se` is stored and the 95% CI is
# taken as estimate +/- 1.96 SE (NCHS itself uses Korn-Graubard intervals, which are slightly asymmetric).
#
# Each item is asked of Q2E as a plain-language question, exactly as a clinician would type it. Q2E is run
# unchanged (no item-specific tuning). `expected_definition` is the Q2E definition that matches the report, or
# null when Q2E has no matching definition (coverage gap). Run 1 (2026-10-11) used the library as it was then;
# the definitions learned from these NCHS reports were added afterwards, so items marked `set: holdout` (added
# after the fixes, never used to tune Q2E) are the fair test of whether the fixes generalize. Hold-out set 1
# exposed three more gaps that were then fixed, so it is no longer unseen; `set: holdout2` items were added after
# that and are the current untouched test.

sources:
  nhsr158:
    citation: "Stierman B, Afful J, Carroll MD, et al. National Health and Nutrition Examination Survey 2017-March 2020 prepandemic data files: development of files and prevalence estimates for selected health outcomes. National Health Statistics Reports no. 158. NCHS; 2021."
    url: "https://stacks.cdc.gov/view/cdc/106273"
  db508:
    citation: "NCHS. Obesity and severe obesity prevalence in adults: United States, August 2021-August 2023. NCHS Data Brief no. 508. 2024."
    url: "https://www.cdc.gov/nchs/products/databriefs/db508.htm"
  db511:
    citation: "NCHS. Hypertension in adults: United States, August 2021-August 2023. NCHS Data Brief no. 511. 2024."
    url: "https://www.cdc.gov/nchs/products/databriefs/db511.htm"
  db515:
    citation: "NCHS. Total and high-density lipoprotein cholesterol in adults: United States, August 2021-August 2023. NCHS Data Brief no. 515. 2024."
    url: "https://www.cdc.gov/nchs/products/databriefs/db515.htm"
  db516:
    citation: "NCHS. Prevalence of total, diagnosed, and undiagnosed diabetes in adults: United States, August 2021-August 2023. NCHS Data Brief no. 516. 2024."
    url: "https://www.cdc.gov/nchs/products/databriefs/db516.htm"
  db519:
    citation: "NCHS. Anemia prevalence: United States, August 2021-August 2023. NCHS Data Brief no. 519. 2024."
    url: "https://www.cdc.gov/nchs/products/databriefs/db519.htm"
  db527:
    citation: "NCHS. Depression prevalence in adolescents and adults: United States, August 2021-August 2023. NCHS Data Brief no. 527. 2025."
    url: "https://www.cdc.gov/nchs/products/databriefs/db527.htm"
  hestat_obesity:
    citation: "NCHS Health E-Stats. Prevalence of overweight, obesity, and severe obesity among adults aged 20 and over: United States, 1960-1962 through 2017-2018. Table 1."
    url: "https://www.cdc.gov/nchs/data/hestat/obesity-adult-17-18/obesity-adult.htm"
  nhsr122:
    citation: "NCHS. Anthropometric reference data for children and adults: United States, 2015-2018. National Health Statistics Reports no. 122."
    url: "https://stacks.cdc.gov/view/cdc/100478"
  tawfik2024:
    citation: "Tawfik YMK, Billingsley H, Bhatt AS, et al. Absolute and functional iron deficiency in the US, 2017-2020. JAMA Netw Open. 2024;7(9):e2433126."
    url: "https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2823909"

items:
  # ---------------- NHANES 2017-March 2020 (P) ----------------
  - id: obesity_P
    source: nhsr158
    table: "Table 5 (crude)"
    cycles: [P]
    question: "What is the prevalence of obesity among US adults aged 20 and over?"
    definition: "BMI >=30 kg/m2; adults 20+; pregnant women excluded"
    expected_definition: obesity_bmi30
    published:
      overall: {est: 41.9, lcl: 39.4, ucl: 44.3}
      Male: {est: 41.6, lcl: 37.4, ucl: 45.8}
      Female: {est: 42.1, lcl: 39.6, ucl: 44.8}
      "20-39": {est: 39.8, lcl: 35.3, ucl: 44.3}
      "40-59": {est: 44.3, lcl: 41.3, ucl: 47.4}
      "60+": {est: 41.5, lcl: 38.4, ucl: 44.7}
  - id: severe_obesity_P
    source: nhsr158
    table: "Table 6 (crude)"
    cycles: [P]
    question: "What is the prevalence of severe obesity (BMI 40 or higher) among US adults aged 20 and over?"
    definition: "BMI >=40 kg/m2; adults 20+"
    expected_definition: severe_obesity_cdc
    published:
      overall: {est: 9.0, lcl: 7.8, ucl: 10.3}
      Male: {est: 6.4, lcl: 5.1, ucl: 8.0}
      Female: {est: 11.4, lcl: 9.7, ucl: 13.3}
      "20-39": {est: 9.7, lcl: 7.7, ucl: 12.0}
      "40-59": {est: 10.7, lcl: 8.9, ucl: 12.8}
      "60+": {est: 6.1, lcl: 5.2, ucl: 7.2}
  - id: hypertension_P
    source: nhsr158
    table: "Table 7 (crude)"
    cycles: [P]
    question: "What is the prevalence of hypertension among US adults aged 18 and over?"
    definition: "Mean of up to 3 oscillometric readings >=130/80 mm Hg or taking BP medication (ACC/AHA 2017); 18+"
    expected_definition: htn_accaha2017
    published:
      overall: {est: 48.1, lcl: 45.4, ucl: 50.8}
      Male: {est: 50.5, lcl: 46.9, ucl: 54.2}
      Female: {est: 45.7, lcl: 42.8, ucl: 48.6}
      "18-39": {est: 23.4, lcl: 20.5, ucl: 26.5}
      "40-59": {est: 52.4, lcl: 48.7, ucl: 56.2}
      "60+": {est: 74.1, lcl: 71.4, ucl: 76.7}
  - id: diabetes_P
    source: nhsr158
    table: "Table 8 (crude)"
    cycles: [P]
    question: "What is the prevalence of diabetes among US adults aged 20 and over?"
    definition: "Diagnosed (self-report, not pregnancy) or fasting plasma glucose >=126 mg/dL or HbA1c >=6.5%; fasting weights; 20+"
    expected_definition: diabetes_nchs
    published:
      overall: {est: 16.2, lcl: 14.2, ucl: 18.3}
      Male: {est: 17.7, lcl: 15.5, ucl: 20.2}
      Female: {est: 14.8, lcl: 12.2, ucl: 17.7}
      "20-39": {est: 4.4, lcl: 2.9, ucl: 6.2}
      "40-59": {est: 16.4, lcl: 13.4, ucl: 19.9}
      "60+": {est: 30.0, lcl: 27.2, ucl: 32.9}
  - id: child_obesity_P
    source: nhsr158
    table: "Table 3"
    cycles: [P]
    question: "What is the prevalence of obesity among US children and adolescents aged 2 to 19 years?"
    definition: "BMI >= sex- and age-specific 95th percentile of the 2000 CDC growth charts; 2-19 y"
    expected_definition: obesity_cdc
    published:
      overall: {est: 19.7, lcl: 17.9, ucl: 21.6}
      Male: {est: 20.9, lcl: 18.9, ucl: 22.9}
      Female: {est: 18.5, lcl: 16.3, ucl: 21.0}
  - id: absolute_iron_deficiency_P
    source: tawfik2024
    table: "Abstract (rounded to whole %)"
    cycles: [P]
    question: "What is the prevalence of absolute iron deficiency (ferritin below 30 ng/mL) among US adults?"
    definition: "Ferritin <30 ng/mL; adults 18+ with ferritin, iron and UIBC"
    expected_definition: aid_tawfik2024
    published:
      overall: {est: 14.0, lcl: 13.0, ucl: 15.0}
  - id: functional_iron_deficiency_P
    source: tawfik2024
    table: "Abstract (rounded to whole %)"
    cycles: [P]
    question: "What is the prevalence of functional iron deficiency among US adults?"
    definition: "Ferritin >=30 ng/mL and TSAT <20%; adults 18+"
    expected_definition: fid_tawfik2024
    published:
      overall: {est: 15.0, lcl: 14.0, ucl: 17.0}

